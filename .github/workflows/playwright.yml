name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permissão necessária para o bot publicar o Allure na branch gh-pages
permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true # Permite gerar o relatório mesmo se houver testes com falha

    # 1. Mantém o relatório HTML nativo do Playwright nos artefatos do GitHub
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # 2. Processa o Allure Report e histórico
    - name: Baixar histórico do GitHub Pages
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
      
    # Garante que os diretórios existam para evitar o erro ENOENT
    - name: Criar diretórios do Allure se não existirem
      if: always()
      run: |
        mkdir -p allure-results
        mkdir -p allure-history

    - name: Gerar relatório Allure
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    # 3. Faz o deploy do Allure para o GitHub Pages
    - name: Publicar relatório no GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history